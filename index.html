<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motivation Place</title>
    <link rel="stylesheet" href="./style.css">
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>
    <div class="ambient-bg">
        <div class="spotlight"></div>
    </div>

    <main class="container">
        <div class="glass-card">
            <h1 id="main-title">Сделать день лучше</h1>
            <div id="output-box" class="output-box hidden"></div>
            <div class="controls">
                <button type="button" id="quote-btn" class="btn primary-btn">Мотивация</button>
                <button type="button" id="card-btn" class="btn secondary-btn">Карта дня</button>
            </div>
        </div>
    </main>

    <script src="./app.js" charset="UTF-8" defer></script>
</body>
</html>
