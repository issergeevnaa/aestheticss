<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мотивация и Карта дня</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>
    <!-- Фоновый RGB прожектор -->
    <div class="ambient-bg">
        <div class="spotlight"></div>
    </div>

    <!-- Основной контейнер -->
    <main class="container">
        <div class="glass-card">
            <h1 id="main-title" class="fade-in">Сделать день лучше</h1>
            
            <!-- Блок вывода контента (цитаты или карты) -->
            <div id="output-box" class="output-box hidden"></div>

            <!-- Кнопки управления -->
            <div class="controls">
                <button id="quote-btn" class="btn primary-btn">Получить мотивацию</button>
                <button id="card-btn" class="btn secondary-btn">Карта дня</button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
